# One-click deploy: Render dashboard -> New -> Blueprint -> select this repo -> Apply. No inputs needed.
databases:
  - name: civicfix-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: civicfix
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: civicfix-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@civicfix.dev
      - key: ADMIN_PASSWORD
        value: Admin#12345
      - key: SEED_DEMO
        value: "true"
      # Optional AI: deploy ./ai-service as a second service and set AI_SERVICE_URL + ANTHROPIC_API_KEY.
